cors:
  originPatterns: http://localhost:8080,http://localhost:3000
security:
  jwt:
    private:
      key: classpath:keys/priv.pem
    public:
      key: classpath:keys/pub.pem
spring:
  application:
    name: trello-clone
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/trello_clone
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
